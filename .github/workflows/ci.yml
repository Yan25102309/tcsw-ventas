name: CI - tcsw-ventas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Java 11 + Maven + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ventas_db
          POSTGRES_USER: ventas_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U ventas_user -d ventas_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5434/ventas_db
      DB_USER: ventas_user
      DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Initialize PostgreSQL schema
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          PGPASSWORD="$DB_PASSWORD" psql -h localhost -p 5434 -U "$DB_USER" -d ventas_db -v ON_ERROR_STOP=1 -f infrastructure/database/001_schema.sql
          PGPASSWORD="$DB_PASSWORD" psql -h localhost -p 5434 -U "$DB_USER" -d ventas_db -v ON_ERROR_STOP=1 -f infrastructure/database/002_schema_venta.sql

      - name: Run Maven test suite (Unit, ArchUnit, REST & PostgreSQL integration)
        run: mvn -B clean test -Djava.awt.headless=true

      - name: Package and smoke-test executable Spring Boot JAR
        run: |
          mvn -B package -DskipTests
          APP_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          JAR_FILE="target/tcsw-ventas-${APP_VERSION}.jar"
          test -f "$JAR_FILE"
          jar tf "$JAR_FILE" | grep -q "BOOT-INF/classes/infrastructure/RestApp.class"

          java -Djava.awt.headless=true -jar "$JAR_FILE" > /tmp/rest-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "JAR process exited prematurely:"
              cat /tmp/rest-app.log
              exit 1
            fi
            STATUS=$(curl -s -o /tmp/productos.json -w "%{http_code}" http://localhost:8080/api/v1/productos || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for packaged JAR on port 8080:"
            cat /tmp/rest-app.log
            exit 1
          fi

          grep -q "Teclado Mecanico" /tmp/productos.json
          DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api-docs)
          test "$DOCS_STATUS" = "200"

  frontend:
    name: Frontend (Angular 16 + Karma ChromeHeadless)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Karma ChromeHeadless)
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: |
          npm run build
          test -f dist/frontend-angular/index.html
