openapi: 3.1.0
info:
  title: API de Ventas tcsw-ventas
  description: Contrato de servicios REST para la gestión de productos y confirmación atómica de ventas.
  version: 1.0.0
paths:
  /api/v1/productos:
    get:
      summary: Consultar todos los productos
      responses:
        '200':
          description: Lista de productos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Registrar un nuevo producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearProductoRequest'
      responses:
        '201':
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/productos/{id}:
    get:
      summary: Consultar un producto por identificador
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '404':
          description: Producto inexistente
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/ventas:
    post:
      summary: Confirmar una venta y descontar existencias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarVentaRequest'
      responses:
        '201':
          description: Venta confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Existencia insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    ProductoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    CrearProductoRequest:
      type: object
      required:
        - id
        - nombre
        - precio
        - existencia
      properties:
        id:
          type: integer
          format: int64
          example: 101
        nombre:
          type: string
          example: "Teclado Mecánico"
        precio:
          type: number
          example: 450.50
        existencia:
          type: integer
          minimum: 0
          example: 15
    ProductoResponse:
      type: object
      required: [id, nombre, precio, existencia]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        precio:
          type: number
        existencia:
          type: integer
          minimum: 0
    ConfirmarVentaRequest:
      type: object
      required: [detalles]
      properties:
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetalleVentaRequest'
    DetalleVentaRequest:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId:
          type: integer
          format: int64
          minimum: 1
        cantidad:
          type: integer
          minimum: 1
    VentaResponse:
      type: object
      properties:
        detalles:
          type: array
          items:
            type: object
    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance, timestamp]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Fallo de persistencia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
